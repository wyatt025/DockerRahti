apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
        - name: backend
          image: gh05t025/lemp-backend:1.0.2
          ports:
            - containerPort: 8000
          env:
            - name: DB_HOST
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: DB_HOST
            - name: DB_USER
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: DB_USER
            - name: DB_NAME
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: DB_NAME
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mysql-secret
                  key: DB_PASSWORD
            # Callback and cookie settings are configuration, not credentials.
            - name: OAUTH_REDIRECT_URI
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: OAUTH_REDIRECT_URI
            - name: SESSION_COOKIE_SECURE
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: SESSION_COOKIE_SECURE
            # GitHub credentials and Flask's session-signing key come from a Secret.
            - name: GITHUB_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: github-oauth
                  key: GITHUB_CLIENT_ID
            - name: GITHUB_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: github-oauth
                  key: GITHUB_CLIENT_SECRET
            - name: FLASK_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: github-oauth
                  key: FLASK_SECRET_KEY
