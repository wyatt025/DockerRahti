apiVersion: v1
kind: ConfigMap
metadata:
  name: app-config
data:
  DB_HOST: "db"
  DB_USER: "appuser"
  DB_NAME: "appdb"
  # Public callback URL must exactly match the GitHub OAuth App registration.
  OAUTH_REDIRECT_URI: "https://frontend-route-dockertorahti.2.rahtiapp.fi/auth/callback"
  # The browser only sends this session cookie over the HTTPS Route.
  SESSION_COOKIE_SECURE: "true"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: db-init-script
data:
  init.sql: |
    CREATE DATABASE IF NOT EXISTS appdb;
    -- Example password only; Rahti supplies the live app password through its Secret.
    CREATE USER IF NOT EXISTS 'appuser'@'%' IDENTIFIED BY 'changeme';
    GRANT ALL PRIVILEGES ON appdb.* TO 'appuser'@'%';
    FLUSH PRIVILEGES;

    USE appdb;
    CREATE TABLE IF NOT EXISTS visits (
        id INT AUTO_INCREMENT PRIMARY KEY,
        visit_time DATETIME
    );
